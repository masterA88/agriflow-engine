name: refresh-data

# Daily recompute of the served artefacts so the dashboard's "data per"
# badge moves without a laptop in the loop:
#   1. anomaly scan  -> sample_data/anomalies/anomalies_all.json + meta.json
#   2. forecasts     -> sample_data/forecasts/forecast_all.json (conformal band)
#   3. backtest      -> analysis/output/backtest_baseline.json (coverage, MAPE)
#
# Price ingestion itself (PIHPS daily pull into sample_data/price_history/)
# is a separate step gated on PIHPS_LIVE=true because the public PIHPS site
# sits behind rate limits; until that is wired the job recomputes on the
# vendored history, which still keeps the artefacts honest and reproducible.

on:
  schedule:
    - cron: "30 7 * * *"   # 14:30 WIB, after the PIHPS 13:00 WIB cut-off
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull PIHPS prices (optional, gated)
        if: ${{ vars.PIHPS_LIVE == 'true' }}
        run: python tools/refresh_prices.py

      - name: Recompute anomalies
        run: python analysis/precompute_anomalies.py

      - name: Recompute forecasts (conformal band)
        run: python analysis/forecast_timesfm.py --method baseline

      - name: Backtest the served forecaster
        run: python analysis/backtest_baseline.py --json analysis/output/backtest_baseline.json

      - name: Sanity-check the API against the new artefacts
        run: pytest -q tests/test_forecast_anomaly_api.py tests/test_backend_v11.py

      - name: Commit refreshed artefacts
        run: |
          git config user.name "agriflow-refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add sample_data/anomalies sample_data/forecasts analysis/output
          if git diff --cached --quiet; then
            echo "No artefact changes."
          else
            git commit -m "data: daily refresh of anomalies, forecasts, backtest ($(date -u +%Y-%m-%d))"
            git push
          fi
